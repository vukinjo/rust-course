<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1040" width="1240" height="1040" xml:space="preserve" role="img" aria-labelledby="title desc">
  <title id="title">shoes: database schema</title>
  <desc id="desc">The PostgreSQL schema of the shoes service after migrations 0001 and 0002, as an entity-relationship diagram in crow's foot notation: products has many variants and many versions, and the associative table version_variants links versions and variants many-to-many. Also the _sqlx_migrations table that SQLx keeps, the constraints and the indexes.</desc>
  <style>
    svg {
      --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --line: #8c959f; --panel: #f6f8fa;
      --start: #2f6fbf; --start-bg: #eaf2fc;
      --layer: #7a4fbf; --layer-bg: #f3edfb;
      --dom: #2e8a57; --dom-bg: #e8f5ee;
      --ext: #a86a12; --ext-bg: #fbf1e1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --line: #6e7681; --panel: #161b22;
        --start: #6ea8f0; --start-bg: #13233a;
        --layer: #b394ec; --layer-bg: #241a36;
        --dom: #5cc28a; --dom-bg: #11291c;
        --ext: #e0a54a; --ext-bg: #2e2210;
      }
    }
    .bg { fill: var(--bg); }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); font-size: 11px; white-space: pre; }
    .m { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
    .mb { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; }
    .u { text-decoration: underline; font-weight: 700; }
    .t { font-size: 22px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .muted { fill: var(--muted); }
    .r { text-anchor: end; }
    .key { font-size: 9.5px; font-weight: 700; fill: var(--start); letter-spacing: 0.3px; }
    .note { font-size: 10.5px; fill: var(--muted); }
    .nul { fill: var(--ext); }
    .rl { font-size: 10.5px; fill: var(--muted); font-style: italic; }
    .ent { fill: var(--start-bg); stroke: var(--start); stroke-width: 1.3; }
    .jn { fill: var(--layer-bg); stroke: var(--layer); stroke-width: 1.3; }
    .sys { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 3; }
    .hsep { stroke-width: 1.1; }
    .ent-l { stroke: var(--start); } .jn-l { stroke: var(--layer); } .sys-l { stroke: var(--line); }
    .sep { stroke: var(--line); stroke-width: 0.5; opacity: 0.45; }
    .rel { stroke: var(--ink); stroke-width: 1.3; fill: none; }
    .zero { stroke: var(--ink); stroke-width: 1.3; fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--line); stroke-width: 0.8; }
  </style>

  <rect class="bg" width="1240" height="1040"/>
  <text x="40" y="44" class="t">shoes: database schema</text>
  <text x="40" y="68" class="muted">PostgreSQL 18, after migrations 0001_create_catalog and 0002_add_variant_stock. Crow's foot notation; every column is NOT NULL unless it says NULL.</text>

  <!-- relationships -->
    <path d="M510 142.0H620.0V164.0H730" class="rel"/>
    <path d="M518 149.0L518 135.0 M524 149.0L524 135.0" class="rel"/>
    <path d="M716 164.0L730 172.0 M716 164.0L730 164.0 M716 164.0L730 156.0" class="rel"/>
    <circle cx="709" cy="164.0" r="5" class="zero"/>
    <text x="628.0" y="157.0" class="rl">has 0..n</text>
    <path d="M140 310V470" class="rel"/>
    <path d="M133 318L147 318 M133 324L147 324" class="rel"/>
    <path d="M140 456L132 470 M140 456L140 470 M140 456L148 470" class="rel"/>
    <circle cx="140" cy="449" r="5" class="zero"/>
    <text x="152" y="394.0" class="rl">has 0..n</text>
    <path d="M510 516.0H620.0V516.0H730" class="rel"/>
    <path d="M518 523.0L518 509.0 M524 523.0L524 509.0" class="rel"/>
    <path d="M716 516.0L730 524.0 M716 516.0L730 516.0 M716 516.0L730 508.0" class="rel"/>
    <circle cx="709" cy="516.0" r="5" class="zero"/>
    <text x="620.0" y="508.0" class="rl" text-anchor="middle">offers 0..n</text>
    <path d="M840 310V470" class="rel"/>
    <path d="M833 318L847 318 M833 324L847 324" class="rel"/>
    <path d="M840 456L832 470 M840 456L840 470 M840 456L848 470" class="rel"/>
    <circle cx="840" cy="449" r="5" class="zero"/>
    <text x="852" y="394.0" class="rl">is in 0..n</text>

  <!-- tables -->
  <g>
    <rect x="40" y="96" width="470" height="214" rx="6" class="ent"/>
    <path d="M40 128H510" class="hsep ent-l"/>
    <text x="52" y="117" class="mb">products</text>
    <text x="498" y="117" class="muted r">a shoe model</text>
    <text x="52" y="143.0" class="key">PK</text>
    <text x="106" y="143.0" class="m u">id</text>
    <text x="216" y="143.0" class="m muted">BIGINT</text>
    <text x="310" y="143.0" class="note">identity</text>
    <path d="M48 150H502" class="sep"/>
    <text x="52" y="165.0" class="key">UK</text>
    <text x="106" y="165.0" class="m">name</text>
    <text x="216" y="165.0" class="m muted">TEXT</text>
    <path d="M48 172H502" class="sep"/>
    <text x="106" y="187.0" class="m">brand</text>
    <text x="216" y="187.0" class="m muted">TEXT</text>
    <path d="M48 194H502" class="sep"/>
    <text x="106" y="209.0" class="m">description</text>
    <text x="216" y="209.0" class="m muted">TEXT</text>
    <text x="310" y="209.0" class="note">default ''</text>
    <path d="M48 216H502" class="sep"/>
    <text x="106" y="231.0" class="m">image</text>
    <text x="216" y="231.0" class="m muted">BYTEA</text>
    <text x="310" y="231.0" class="note nul">NULL</text>
    <path d="M48 238H502" class="sep"/>
    <text x="106" y="253.0" class="m">image_type</text>
    <text x="216" y="253.0" class="m muted">TEXT</text>
    <text x="310" y="253.0" class="note nul">NULL · check: media type</text>
    <path d="M48 260H502" class="sep"/>
    <text x="106" y="275.0" class="m">created_at</text>
    <text x="216" y="275.0" class="m muted">TIMESTAMPTZ</text>
    <text x="310" y="275.0" class="note">default now()</text>
    <path d="M48 282H502" class="sep"/>
    <text x="106" y="297.0" class="m">updated_at</text>
    <text x="216" y="297.0" class="m muted">TIMESTAMPTZ</text>
    <text x="310" y="297.0" class="note">default now()</text>
  </g>
  <g>
    <rect x="730" y="96" width="470" height="214" rx="6" class="ent"/>
    <path d="M730 128H1200" class="hsep ent-l"/>
    <text x="742" y="117" class="mb">variants</text>
    <text x="1188" y="117" class="muted r">one sellable variant, with its own SKU</text>
    <text x="742" y="143.0" class="key">PK</text>
    <text x="796" y="143.0" class="m u">id</text>
    <text x="906" y="143.0" class="m muted">BIGINT</text>
    <text x="1000" y="143.0" class="note">identity</text>
    <path d="M738 150H1192" class="sep"/>
    <text x="742" y="165.0" class="key">FK</text>
    <text x="796" y="165.0" class="m">product_id</text>
    <text x="906" y="165.0" class="m muted">BIGINT</text>
    <text x="1000" y="165.0" class="note">→ products.id · cascade</text>
    <path d="M738 172H1192" class="sep"/>
    <text x="742" y="187.0" class="key">UK</text>
    <text x="796" y="187.0" class="m">sku</text>
    <text x="906" y="187.0" class="m muted">TEXT</text>
    <path d="M738 194H1192" class="sep"/>
    <text x="796" y="209.0" class="m">description</text>
    <text x="906" y="209.0" class="m muted">TEXT</text>
    <text x="1000" y="209.0" class="note">default ''</text>
    <path d="M738 216H1192" class="sep"/>
    <text x="796" y="231.0" class="m">price_cents</text>
    <text x="906" y="231.0" class="m muted">BIGINT</text>
    <text x="1000" y="231.0" class="note">check: &gt; 0</text>
    <path d="M738 238H1192" class="sep"/>
    <text x="796" y="253.0" class="m">image</text>
    <text x="906" y="253.0" class="m muted">BYTEA</text>
    <text x="1000" y="253.0" class="note nul">NULL</text>
    <path d="M738 260H1192" class="sep"/>
    <text x="796" y="275.0" class="m">image_type</text>
    <text x="906" y="275.0" class="m muted">TEXT</text>
    <text x="1000" y="275.0" class="note nul">NULL · check: media type</text>
    <path d="M738 282H1192" class="sep"/>
    <text x="796" y="297.0" class="m">stock</text>
    <text x="906" y="297.0" class="m muted">INTEGER</text>
    <text x="1000" y="297.0" class="note">default 0 · check: ≥ 0 · 0002</text>
  </g>
  <g>
    <rect x="40" y="470" width="470" height="148" rx="6" class="ent"/>
    <path d="M40 502H510" class="hsep ent-l"/>
    <text x="52" y="491" class="mb">versions</text>
    <text x="498" y="491" class="muted r">a release of the model</text>
    <text x="52" y="517.0" class="key">PK</text>
    <text x="106" y="517.0" class="m u">id</text>
    <text x="216" y="517.0" class="m muted">BIGINT</text>
    <text x="310" y="517.0" class="note">identity</text>
    <path d="M48 524H502" class="sep"/>
    <text x="52" y="539.0" class="key">FK UK1</text>
    <text x="106" y="539.0" class="m">product_id</text>
    <text x="216" y="539.0" class="m muted">BIGINT</text>
    <text x="310" y="539.0" class="note">→ products.id · cascade</text>
    <path d="M48 546H502" class="sep"/>
    <text x="52" y="561.0" class="key">UK1</text>
    <text x="106" y="561.0" class="m">number</text>
    <text x="216" y="561.0" class="m muted">INTEGER</text>
    <text x="310" y="561.0" class="note">check: &gt; 0</text>
    <path d="M48 568H502" class="sep"/>
    <text x="106" y="583.0" class="m">notes</text>
    <text x="216" y="583.0" class="m muted">TEXT</text>
    <text x="310" y="583.0" class="note">default ''</text>
    <path d="M48 590H502" class="sep"/>
    <text x="106" y="605.0" class="m">released_on</text>
    <text x="216" y="605.0" class="m muted">DATE</text>
  </g>
  <g>
    <rect x="730" y="470" width="470" height="82" rx="6" class="jn"/>
    <path d="M730 502H1200" class="hsep jn-l"/>
    <text x="742" y="491" class="mb">version_variants</text>
    <text x="1188" y="491" class="muted r">associative table: versions ⟷ variants</text>
    <text x="742" y="517.0" class="key">PK FK</text>
    <text x="796" y="517.0" class="m u">version_id</text>
    <text x="906" y="517.0" class="m muted">BIGINT</text>
    <text x="1000" y="517.0" class="note">→ versions.id · cascade</text>
    <path d="M738 524H1192" class="sep"/>
    <text x="742" y="539.0" class="key">PK FK</text>
    <text x="796" y="539.0" class="m u">variant_id</text>
    <text x="906" y="539.0" class="m muted">BIGINT</text>
    <text x="1000" y="539.0" class="note">→ variants.id · cascade</text>
  </g>
  <g>
    <rect x="40" y="730" width="470" height="170" rx="6" class="sys"/>
    <path d="M40 762H510" class="hsep sys-l"/>
    <text x="52" y="751" class="mb">_sqlx_migrations</text>
    <text x="498" y="751" class="muted r">written by SQLx, not by the service</text>
    <text x="52" y="777.0" class="key">PK</text>
    <text x="106" y="777.0" class="m u">version</text>
    <text x="216" y="777.0" class="m muted">BIGINT</text>
    <text x="310" y="777.0" class="note">from the file name</text>
    <path d="M48 784H502" class="sep"/>
    <text x="106" y="799.0" class="m">description</text>
    <text x="216" y="799.0" class="m muted">TEXT</text>
    <path d="M48 806H502" class="sep"/>
    <text x="106" y="821.0" class="m">installed_on</text>
    <text x="216" y="821.0" class="m muted">TIMESTAMPTZ</text>
    <text x="310" y="821.0" class="note">default now()</text>
    <path d="M48 828H502" class="sep"/>
    <text x="106" y="843.0" class="m">success</text>
    <text x="216" y="843.0" class="m muted">BOOLEAN</text>
    <path d="M48 850H502" class="sep"/>
    <text x="106" y="865.0" class="m">checksum</text>
    <text x="216" y="865.0" class="m muted">BYTEA</text>
    <text x="310" y="865.0" class="note">SHA-384 of the file</text>
    <path d="M48 872H502" class="sep"/>
    <text x="106" y="887.0" class="m">execution_time</text>
    <text x="216" y="887.0" class="m muted">BIGINT</text>
