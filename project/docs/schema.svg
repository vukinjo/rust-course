  <!-- legend -->
  <rect x="560" y="640" width="640" height="375" rx="6" class="panel"/>
  <text x="576" y="666" class="h">Notation</text>
  <path d="M580 692H660" class="rel"/>
    <path d="M652 685L652 699 M646 685L646 699" class="rel"/>
  <text x="676" y="696">exactly one: the foreign key is NOT NULL</text>
  <path d="M580 718H660" class="rel"/>
    <path d="M646 718L660 726 M646 718L660 718 M646 718L660 710" class="rel"/>
    <circle cx="639" cy="718" r="5" class="zero"/>
  <text x="676" y="722">zero or many</text>
  <text x="580" y="748" class="key">PK</text>
  <text x="676" y="748">primary key, also underlined</text>
  <text x="580" y="770" class="key">FK</text>
  <text x="676" y="770">foreign key, ON DELETE CASCADE: deleting the parent row deletes this row</text>
  <text x="580" y="792" class="key">UK</text>
  <text x="676" y="792">unique; UK1 marks the columns of one composite UNIQUE constraint</text>
  <text x="580" y="814" class="note nul">NULL</text>
  <text x="676" y="814">nullable column</text>
  <text x="576" y="844" class="h">Constraints and indexes</text>
  <text x="580" y="866" class="m">identity: GENERATED ALWAYS AS IDENTITY, a sequence for each table; ids can have gaps</text>
  <text x="580" y="884" class="m">check: media type: image_type IN ('image/jpeg', 'image/png', 'image/webp')</text>
  <text x="580" y="902" class="m">CHECK ((image IS NULL) = (image_type IS NULL)) on products and variants</text>
  <text x="580" y="920" class="m">UNIQUE (product_id, number) on versions: one number for each version of a product</text>
  <text x="580" y="938" class="m">PRIMARY KEY (version_id, variant_id): a link cannot be stored two times</text>
  <text x="580" y="956" class="m">indexes: every PK and UNIQUE, plus variants_product_id_idx (product_id)</text>
  <text x="580" y="974" class="m">and version_variants_variant_id_idx (variant_id); version_id lookups use the PK</text>
  <text x="580" y="992" class="m">images are BYTEA in the row; the API returns only their type and size</text>
</svg>
