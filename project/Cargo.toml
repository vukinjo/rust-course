[package]
name = "shoes"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
config = { version = "0.15.27", default-features = false }
reqwest = { version = "0.13.5", features = ["json", "query"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.2", features = ["serde", "v7"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5", features = ["util"] }

# A release build optimized for size: `cargo build --profile small` writes
# target/small/shoes, about 5.8 MB instead of 15 MB for --release. The code is
# somewhat slower than opt-level 3, which this I/O-bound service doesn't notice,
# and crash backtraces lose their function names.
[profile.small]
inherits = "release"
strip = true        # drop the symbol table and debug info
opt-level = "z"     # optimize for size instead of speed
lto = true          # optimize across all crates at link time
codegen-units = 1   # one unit per crate, so the optimizer sees more at once
